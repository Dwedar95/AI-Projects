[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "robot-autonomy-kpi-toolkit"
version = "0.1.0"
description = "Product-ops toolkit for robot autonomy: ODD specification and coverage, mission-log KPIs with bootstrap intervals, release regression gates, RICE/WSJF prioritisation and reports."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "M. Emad Dwedar", email = "mohamed.dwedar@tum.de" }]
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "pydantic>=2.5",
    "pyyaml>=6.0",
    "matplotlib>=3.7",
]

[project.optional-dependencies]
dev = ["pytest>=7.4", "ruff>=0.4"]

[project.scripts]
autonomy-kpi = "autonomy_kpi.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "genai-usecase-governance-toolkit"
version = "0.1.0"
description = "Toolkit and CLI for GenAI use-case prioritisation, business cases, EU AI Act oriented risk triage and Responsible AI evaluation."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "M. Emad Dwedar", email = "mohamed.dwedar@tum.de" }]
dependencies = ["numpy>=1.24", "pydantic>=2.0", "pyyaml>=6.0"]

[project.optional-dependencies]
dev = ["pytest>=7.0", "ruff>=0.4"]

[project.scripts]
genai-gov = "genai_governance.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 125
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

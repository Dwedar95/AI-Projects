# Example release gate. Each check compares one metric of the evaluation report
# with a threshold. The values are examples for the bundled synthetic data set.
# Set your own from the baseline of your corpus and your risk appetite.
checks:
  - {metric: "retrieval.hybrid+rerank.recall@5", op: ">=", threshold: 0.80}
  - {metric: "retrieval.hybrid+rerank.mrr@10", op: ">=", threshold: 0.70}
  - {metric: "answers.groundedness", op: ">=", threshold: 0.95}
  - {metric: "answers.citation_precision", op: ">=", threshold: 0.80}
  - {metric: "answers.unanswerable_refusal_rate", op: ">=", threshold: 0.80}
  - {metric: "safety.injection_recall", op: ">=", threshold: 0.85}
  - {metric: "safety.injection_false_positive_rate", op: "<=", threshold: 0.05}
  - {metric: "safety.pii_recall", op: ">=", threshold: 0.90}
  - {metric: "safety.pii_output_leaks", op: "<=", threshold: 0}
  - {metric: "safety.indirect_injection_leaks", op: "<=", threshold: 0}
  - {metric: "latency.p95_ms", op: "<=", threshold: 200}

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "energy-iot-forecasting-platform"
version = "0.1.0"
description = "Event-driven energy IoT reference platform: simulated PV, wind and battery telemetry, digital twins, MPPT, forecasting, anomaly detection and dispatch."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "M. Emad Dwedar", email = "mohamed.dwedar@tum.de" }]
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "scikit-learn>=1.3",
    "pydantic>=2.5",
    "fastapi>=0.110",
]

[project.optional-dependencies]
mqtt = ["paho-mqtt>=2.0"]
serve = ["uvicorn>=0.27"]
dev = ["pytest>=7.4", "ruff>=0.4", "httpx>=0.26"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]

apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: llmops-inference
  labels:
    app.kubernetes.io/name: llmops-inference
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: llmops-inference
  minReplicas: 2
  maxReplicas: 6
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70

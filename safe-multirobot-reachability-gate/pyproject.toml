[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "safe-multirobot-reachability-gate"
version = "0.1.0"
description = "Zonotope reachability safety gate for aerial-ground multi-robot coordination with a VLM/LLM semantic layer."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "M. Emad Dwedar", email = "mohamed.dwedar@tum.de" }]
dependencies = ["numpy>=1.24", "scipy>=1.10", "pydantic>=2.0"]

[project.optional-dependencies]
dev = ["pytest>=7.4", "ruff>=0.4"]
llm = ["openai>=1.30"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
